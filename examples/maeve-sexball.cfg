# Replace the old [axiscope] and [tools_calibrate] sections with this ONE block.
# Keep tools_calibrate.py installed, but do not configure [tools_calibrate].
# Replace YOUR_PIN with the actual SexBall pin and verified polarity.
[axiscope]
pin: ^!YOUR_PIN

# Approximate T0 carriage coordinates above the SexBall, from your earlier setup.
zswitch_x_pos: 227.471875
zswitch_y_pos: 353.703125
zswitch_z_pos: 5.00

# Verify this clears your switch, camera and entire travel path before running.
safe_z: 20
move_speed: 20
z_move_speed: 4
travel_speed: 20
speed: 2
lift_speed: 4
lift_z: 1
spread: 7
lower_z: 1.0
final_lift_z: 6
max_z_travel: 10
max_offset: 5
samples: 5
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.05
samples_tolerance_retries: 2

# Camera XYZ are captured using AXISCOPE_SET_CAMERA_POSITION CURRENT=1.
# They are independent of the SexBall XYZ and saved with your calibration.
# No camera coordinates are guessed here.
# Existing nozzle preparation hooks may be retained. They must not change offsets.
